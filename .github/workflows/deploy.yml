name: Deploy to Tencent Cloud

# Runs on every push to main (auto-deploy).
# Also exposes a manual trigger via GitHub UI → Actions → Deploy → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight deploy if a new commit lands so we don't queue up.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy → liuyikai.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 120.53.86.4
          username: ubuntu
          key: ${{ secrets.TENCENT_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/portfolio

            echo "==> 📥 git pull (with retries — China <> GitHub is flaky)"
            git_pull_ok=0
            for attempt in 1 2 3 4 5; do
              if git pull --ff-only origin main; then
                echo "    ✅ git pull succeeded on attempt $attempt"
                git_pull_ok=1
                break
              fi
              echo "    ⚠️ attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            if [ "$git_pull_ok" != "1" ]; then
              echo "    ❌ git pull failed 5x — GFW / TLS issue persists"
              exit 1
            fi

            echo "==> 📦 npm install"
            npm install --no-audit --no-fund --silent

            echo "==> 🔨 npm run build"
            npm run build

            echo "==> ♻️  pm2 restart"
            pm2 restart portfolio --update-env

            echo "==> 🩺 health check"
            sleep 2
            curl -fsSL http://localhost:3000 -o /dev/null && echo "    ✅ localhost:3000 → 200"

            echo "==> 📊 PM2"
            pm2 list --no-color

      - name: 🌐 Verify production
        run: |
          sleep 3
          if curl -fsSL -o /dev/null https://liuyikai.com; then
            echo "✅ https://liuyikai.com → 200"
          else
            echo "⚠️ Public URL not responding — check nginx / DNS"
            exit 1
          fi
